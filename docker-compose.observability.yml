# Prometheus + Grafana（CentOS 虚拟机内运行，抓取 Windows 宿主机应用）
# 拓扑：Windows Spring Boot :8081  ←  VM Docker Prometheus/Grafana
# 抓取地址见 observability/prometheus/prometheus.yml（NAT 下为 10.0.2.2:8081）
#
# 虚拟机内启动：
#   cd /opt/factory-observability && docker compose -f docker-compose.observability.yml up -d
# VirtualBox 需转发：19090→19090、3000→3000，然后在 Windows 访问：
#   Prometheus http://localhost:19090
#   Grafana    http://localhost:3000  (admin / admin)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: factory-demo-prometheus
    restart: unless-stopped
    ports:
      # 虚拟机 9090 被 cockpit 占用，对外映射 19090
      - "19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      # Windows / macOS Docker Desktop：容器内访问宿主机应用
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: factory-demo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
